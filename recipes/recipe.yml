---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: yevos
description: This is my personal OS image.
base-image: quay.io/fedora/fedora-silverblue
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /
  #- from-file: base/flatpak.yml
  - from-file: base/hyprland.yml
  - from-file: base/rpmfusion.yml
  - from-file: base/applications.yml
  - from-file: base/silverblue.yml
  - type: initramfs
  - type: signing
